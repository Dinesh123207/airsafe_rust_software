; Open THIS folder (wokwi/) in VS Code as the PlatformIO project.
; The firmware source lives one level up (firmware/airsafe_node), so the
; simulated build and the real build compile the very same code.
[platformio]
src_dir = ../firmware/airsafe_node

; ---- Simulated node: fake sensor values, data leaves over USB serial ----
; Needs Arduino-ESP32 core 3.x (the firmware uses ArduinoJson 7).
[env:wokwi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIM_MODE=1 -DTRANSPORT_SERIAL=1
lib_deps =
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

; ---- Real hardware: all sensors, WiFi/HTTP to the backend ----
; Edit firmware/airsafe_node/config.h first (WiFi, API_BASE_URL, DEVICE_ID/KEY).
; Library names are the registry names as best known: if one fails to resolve,
; search it at registry.platformio.org and fix the name here.
[env:esp32_real]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit SGP30 Sensor
  ncmreynolds/ld2410
  fu-hsi/PMS Library
  plerup/EspSoftwareSerial
  strange-v/MHZ19
  rweather/Crypto            ; only needed when DEVICE_SIGNING is 1 (Ed25519)
