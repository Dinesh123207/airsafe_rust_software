[package]
name = "airsafe-api"
version = "0.4.0"
edition = "2021"
rust-version = "1.78"
description = "AIRSAFE API: Axum + PostgreSQL + verifiable sensor ledger anchored on an EVM chain"

[lib]
name = "airsafe_api"
path = "src/lib.rs"

[[bin]]
name = "airsafe-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
hex = "0.4"
jsonwebtoken = "9"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
