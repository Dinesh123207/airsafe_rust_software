# Whole stack:  docker compose up --build
#   web app + API   http://localhost:8000      PostgreSQL :5432      local EVM chain (Anvil) :8545
# Dev keys below are the PUBLIC Anvil test keys. Never use them on a real network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airsafe
      POSTGRES_PASSWORD: airsafe
      POSTGRES_DB: airsafe
    ports: ["5432:5432"]
    volumes: ["airsafe_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsafe -d airsafe"]
      interval: 3s
      timeout: 3s
      retries: 20

  chain:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--state", "/anvil/state.json"]
    ports: ["8545:8545"]
    volumes: ["anvil_state:/anvil"]

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on: [chain]
    working_dir: /contracts
    volumes: ["./contracts:/contracts"]
    environment:
      KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until cast chain-id --rpc-url http://chain:8545 >/dev/null 2>&1; do sleep 1; done
        if [ "$$(cast code 0x5FbDB2315678afecb367f032d93F642f64180aa3 --rpc-url http://chain:8545)" = "0x" ]; then
          forge create src/AirSafeAnchor.sol:AirSafeAnchor --rpc-url http://chain:8545 --private-key "$$KEY" --broadcast
        else
          echo "AirSafeAnchor already deployed"
        fi

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      deploy: { condition: service_completed_successfully }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgres://airsafe:airsafe@db:5432/airsafe
      AIRSAFE_SECRET_KEY: change-me-to-a-long-random-string
      SIM_ENABLED: "1"
      SIWE_DOMAIN: localhost
      SIWE_URI: http://localhost:8000
      SIWE_CHAIN_ID: "31337"
      ANCHOR_RPC_URL: http://chain:8545
      ANCHOR_CHAIN_ID: "31337"
      ANCHOR_CONTRACT: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      ANCHOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      ANCHOR_INTERVAL_SECS: "60"

volumes:
  airsafe_pg:
  anvil_state:
